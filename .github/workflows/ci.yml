# ---------------------------------------------------------------------------
# Pull.fm - build / typecheck / test
#
# Kept separate from security.yml so a CVE disclosure on unchanged code does not
# masquerade as a build failure, and so the security gate can run on a schedule
# independently of code changes.
# ---------------------------------------------------------------------------
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck, lint, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pullfm
          POSTGRES_PASSWORD: pullfm_ci_not_a_secret
          POSTGRES_DB: pullfm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pullfm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Separate instance with noeviction. Rate-limit counters must never share
      # an eviction policy with the cache: on allkeys-lru they are silently
      # evicted and every limit fails open. See THREAT-MODEL T11.
      redis-quota:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://pullfm:pullfm_ci_not_a_secret@127.0.0.1:5432/pullfm_test
      REDIS_URL: redis://127.0.0.1:6379
      REDIS_QUOTA_URL: redis://127.0.0.1:6380
      # Also consumed by `pnpm test`, which runs the migration verifier.
      ADMIN_URL: postgres://pullfm:pullfm_ci_not_a_secret@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `version:` input. package.json's `packageManager` field is the
      # single source of truth, and v6 of this action errors if both are set.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      # BEFORE typecheck, not after. The workspace packages publish types from
      # `dist`, so on a clean checkout - which is the only kind CI ever has -
      # `@pull-fm/crypto` and `@pull-fm/upstream` do not resolve until they are
      # built. Running typecheck first passed locally for months purely because
      # a developer's `dist` was left over from an earlier run, which is
      # exactly the class of green-locally-red-in-CI this ordering causes.
      - name: build
        run: pnpm build

      - name: typecheck
        run: pnpm typecheck

      - name: lint
        run: pnpm lint

      - name: format check
        run: pnpm format:check

      - name: unit tests
        run: pnpm test

      # Gate 1: migrations must be reversible over two full cycles, the account
      # deletion cascade must be transactional, and the schema's defensive
      # constraints must actually fire. See docs/PLAN.md.
      - name: "Gate 1: migration verification"
        run: node packages/db/scripts/verify-migrations.mjs
        env:
          ADMIN_URL: postgres://pullfm:pullfm_ci_not_a_secret@127.0.0.1:5432/postgres

      # Gate 8: an accepted risk with no expiry is a permanently ignored
      # finding, so an expired entry fails the build.
      - name: "Gate 8: accepted-risk register"
        run: node security/scripts/check-accepted-risks.mjs

      # The four background jobs enforce the retention windows the privacy
      # policy publishes, and they spent a while existing as commands that
      # nothing invoked. This asserts they are scheduled, enabled, bounded, and
      # that exit 1 (could not run, changed nothing) is treated differently from
      # exit 2 (ran, worth a look). On this runner it also cross-checks every
      # calendar expression against systemd's own parser, which is the reason
      # the step runs here rather than only on a developer's machine.
      - name: "background job schedule"
        run: node infra/scripts/check-job-schedule.mjs

      # Gate 8: a tag can be repointed at different code by whoever controls
      # the upstream namespace, and that code runs against our checked-out
      # source. A commit SHA cannot be moved.
      - name: "Gate 8: action pinning"
        run: node security/scripts/check-action-pinning.mjs

      - name: "security tooling self-tests"
        run: |
          node --test security/scripts/check-accepted-risks.test.mjs
          node --test security/bola/route-matrix.test.mjs
