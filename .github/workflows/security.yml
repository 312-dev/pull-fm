# ---------------------------------------------------------------------------
# Pull.fm - Security gates (Gate 8)
#
# BLOCKING on high/critical. This repo is public, so `secrets` runs first and
# fails fast: a leaked credential in a public repo is compromised the moment it
# is pushed, so the scan must gate the merge, not merely report on it.
# ---------------------------------------------------------------------------
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Re-scan weekly: new CVEs land against unchanged code.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret committed earlier and reverted is still
          # exposed in the object store and must still fail the build.
          fetch-depth: 0
      # The gitleaks ACTION requires a paid licence for organization-owned
      # repositories. The gitleaks binary itself is MIT licensed and free, so we
      # run the CLI directly. This also removes a third-party action from the
      # supply chain of the job that guards our secrets.
      - name: install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: scan history for secrets
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --verbose

  sast:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.171.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: semgrep scan
        run: |
          semgrep scan \
            --config=p/default \
            --config=p/typescript \
            --config=p/nodejs \
            --config=p/owasp-top-ten \
            --config=p/secrets \
            --config=p/dockerfile \
            --config=p/terraform \
            --config=.semgrep/ \
            --error \
            --severity=ERROR \
            --sarif --output=semgrep.sarif \
            --metrics=off
      - name: upload sarif
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore

  deps:
    name: dependencies + filesystem (trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: table
      - name: generate SBOM
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.json
      - name: upload SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: ignore

  iac:
    name: IaC misconfiguration (trivy config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
