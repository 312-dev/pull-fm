# ---------------------------------------------------------------------------
# Pull.fm - project-specific Semgrep rules
#
# These encode invariants the generic rulesets cannot know about. They exist to
# make Gate 3 ("no plaintext tokens in logs") and Gate 8 (BOLA) mechanically
# enforceable rather than review-dependent.
# ---------------------------------------------------------------------------
rules:
  # -------------------------------------------------------------------------
  # Gate 3: per-user third-party tokens must never reach a log sink, an error
  # message, or a telemetry span. A leaked Last.fm session key or ListenBrainz
  # token in a log aggregator is a real credential compromise.
  # -------------------------------------------------------------------------
  - id: pullfm-no-token-in-logs
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Potential plaintext credential in a log/telemetry sink. Per-user tokens
      (ListenBrainz, Last.fm session keys) and API secrets must never be logged.
      Log a stable non-reversible identifier instead (e.g. connection id).
    patterns:
      - pattern-either:
          - pattern: $LOGGER.$LEVEL(..., <... $OBJ.accessToken ...>, ...)
          - pattern: $LOGGER.$LEVEL(..., <... $OBJ.refreshToken ...>, ...)
          - pattern: $LOGGER.$LEVEL(..., <... $OBJ.sessionKey ...>, ...)
          - pattern: $LOGGER.$LEVEL(..., <... $OBJ.userToken ...>, ...)
          - pattern: $LOGGER.$LEVEL(..., <... $OBJ.apiSecret ...>, ...)
          - pattern: $LOGGER.$LEVEL(..., <... $OBJ.plaintext ...>, ...)
          - pattern: console.$LEVEL(..., <... $OBJ.accessToken ...>, ...)
          - pattern: console.$LEVEL(..., <... $OBJ.sessionKey ...>, ...)
      - metavariable-regex:
          metavariable: $LEVEL
          regex: ^(log|info|warn|error|debug|trace|fatal)$

  # -------------------------------------------------------------------------
  # Decrypted credentials must stay in memory for the duration of one upstream
  # call. Assigning one onto a long-lived object widens the blast radius of any
  # future serialization bug (error reporter, response body, cache write).
  # -------------------------------------------------------------------------
  - id: pullfm-no-decrypted-token-on-request
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Do not attach a decrypted credential to the request/reply object. It will
      eventually be serialized by an error handler or telemetry hook. Pass it
      as a local argument to the upstream client instead.
    pattern-either:
      - pattern: $REQ.accessToken = $V
      - pattern: $REQ.sessionKey = $V
      - pattern: $REQ.userToken = $V

  # -------------------------------------------------------------------------
  # Gate 8 / OWASP API #1 (BOLA): any query filtered only by a client-supplied
  # id, without an ownership predicate, is an IDOR. This catches the common
  # shape; the automated authz suite is the real proof, this is the tripwire.
  # -------------------------------------------------------------------------
  - id: pullfm-bola-missing-owner-predicate
    languages: [typescript]
    severity: WARNING
    message: >-
      Query appears to select a user-owned row by id without a user_id / owner
      predicate. Every object read or write must be scoped to the authenticated
      subject (OWASP API Security Top 10 #1, BOLA). Confirm the ownership check.
    patterns:
      # The window must extend PAST the id predicate, or an ownership check
      # written after it (AND user_id = $2) falls outside the match and the
      # pattern-not-regex below never sees it. That produced five false
      # positives on correctly-scoped queries.
      - pattern-regex: (?i)(select|delete|update)[\s\S]{0,200}?\bwhere\b\s+(?:\w+\.)?id\s*=\s*\$\{?\d?[\s\S]{0,200}
      - pattern-not-regex: (?i)user_id|owner_id|account_id|subject_id
      # `users` is the one table where `id` IS the subject id, so there is no
      # separate ownership column to look for and never will be. Excluding it
      # is not a suppression: a query scoped to users.id is already scoped to
      # exactly one subject.
      - pattern-not-regex: (?i)\b(from|into|update)\s+users\b
      # api_tokens rows are addressed by (user_id, id) via a helper that binds
      # the subject; the literal here is a fragment, not the whole statement.
      - pattern-not-regex: (?i)\bapi_tokens\b[\s\S]{0,300}\buser_id\b

  # -------------------------------------------------------------------------
  # Secrets must be resolved at runtime from the vault/op:// reference, never
  # read from a committed file or hardcoded. This repo is public.
  # -------------------------------------------------------------------------
  - id: pullfm-no-hardcoded-upstream-secret
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Hardcoded credential-shaped literal. Secrets resolve at runtime from the
      environment (populated from 1Password / the vault). Never inline a value.
    patterns:
      - pattern-either:
          - pattern: $K = "sk_live_..."
          - pattern: $K = "sk_test_..."
          - pattern-regex: \b(?:apiKey|apiSecret|clientSecret|password|token)\s*[:=]\s*["'][A-Za-z0-9_\-]{24,}["']
      - pattern-not-regex: op://
      - pattern-not-regex: process\.env
      - pattern-not-regex: (?i)(example|placeholder|changeme|redacted|test-only|fixture)

  # -------------------------------------------------------------------------
  # Upstream ToS compliance: MusicBrainz requires a descriptive User-Agent with
  # contact info on every request and enforces 1 req/s. Calls must route through
  # our rate-limited client, never raw fetch.
  #
  # AUDIT 2026-07-29: the original pattern was
  #   \bfetch\s*\(\s*["'`][^"'`]*musicbrainz\.org
  # which requires the host to appear as a literal INSIDE the first string
  # argument to fetch. Three shapes were demonstrated to slip past it and reach
  # the network unmetered:
  #
  #   fetch(`${MUSICBRAINZ_BASE_URL}/artist/${id}`)   the constant is exported
  #   fetch("https://" + HOST + "/ws/2/...")          host assembled from parts
  #   new ProviderClient({ name: "musicbrainz", ... }) with no rateLimiter
  #
  # The third is the dangerous one, because it looks like using the sanctioned
  # abstraction. `rateLimiter` is optional on ProviderClientOptions, so a second
  # MusicBrainz client with no pacing compiles, type-checks, and doubles the
  # egress rate against a provider that revokes without appeal.
  #
  # The three rules below cover host-in-a-literal, host-by-constant, and
  # client-without-a-limiter respectively. The last two are cheap identifier
  # checks precisely so they cannot be defeated by rearranging a string.
  # -------------------------------------------------------------------------
  - id: pullfm-musicbrainz-must-use-ratelimited-client
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Direct call to musicbrainz.org. All MusicBrainz traffic must go through
      the shared rate-limited client (1 req/s + required User-Agent), or we risk
      being blocked and violating their terms.
    # The rate-limited client itself is the one sanctioned caller.
    paths:
      exclude:
        - "**/musicbrainz/client.ts"
        - "**/*.test.ts"
    pattern-either:
      # The host as a literal anywhere in the call, not only in the first
      # string argument. `[^;]` bounds the window to one statement so this
      # cannot run away across a file.
      - pattern-regex: (?i)\bfetch\s*\([^;]{0,300}?musicbrainz\.org
      # The host assembled from fragments to avoid containing itself.
      - pattern-regex: (?i)["'`]musicbrainz["'`]\s*\+
      - pattern-regex: (?i)\+\s*["'`]musicbrainz\.

  # -------------------------------------------------------------------------
  # The base URL is an internal detail of the sanctioned client. Anything that
  # needs it is, by construction, about to make an unmetered request.
  # -------------------------------------------------------------------------
  - id: pullfm-musicbrainz-base-url-is-internal
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      MUSICBRAINZ_BASE_URL is internal to the rate-limited MusicBrainz client.
      Importing it means building a request outside the 1 req/s queue. Call
      MusicBrainzClient instead; it is injected on the upstream bundle.
    paths:
      exclude:
        - "**/musicbrainz/client.ts"
        # The package barrel re-exports it for the client's own tests.
        - "**/upstream/src/index.ts"
        - "**/*.test.ts"
    # A syntactic pattern, NOT a regex on the raw text. The first draft of this
    # rule was `pattern-regex: \bMUSICBRAINZ_BASE_URL\b`, which fired on three
    # PROSE COMMENTS in the load harness whose entire point is to record that no
    # such variable exists (load/safety/upstream-guard.mjs asserts it). That is
    # the false-positive shape this project already has a precedent for, and the
    # dangerous resolution would have been to loosen the rule until it went
    # quiet. Matching the identifier as an expression, plus the import that
    # would bring it into scope, ignores comments and strings by construction.
    pattern-either:
      - pattern: MUSICBRAINZ_BASE_URL
      - pattern-regex: ^\s*import\s[^;]*\bMUSICBRAINZ_BASE_URL\b

  # -------------------------------------------------------------------------
  # A ProviderClient aimed at MusicBrainz with no `rateLimiter` is the failure
  # that looks most like correct code. `rateLimiter` is optional on the options
  # type because most providers pace themselves with a quota counter instead;
  # MusicBrainz is the one provider for which it is a licence condition.
  # -------------------------------------------------------------------------
  - id: pullfm-musicbrainz-provider-client-needs-limiter
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      A ProviderClient pointed at MusicBrainz was constructed without a
      rateLimiter. MusicBrainz allows 1 request/second for the WHOLE service,
      per IP, so a second unpaced client multiplies the egress rate and gets the
      IP blocked with no appeals process. Pass the shared RateLimiter, or use
      MusicBrainzClient which requires one at construction.
    paths:
      exclude:
        - "**/musicbrainz/client.ts"
        - "**/*.test.ts"
    patterns:
      - pattern-regex: (?is)new\s+ProviderClient\s*\(\s*\{[^}]{0,400}musicbrainz[^;]{0,400}
      - pattern-not-regex: rateLimiter
