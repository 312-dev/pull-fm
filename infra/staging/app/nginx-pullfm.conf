# ---------------------------------------------------------------------------
# Pull.fm staging origin - TLS termination and Cloudflare enforcement.
#
# Traffic path: client -> Cloudflare edge -> Hetzner LB (TCP passthrough, PROXY
# protocol) -> this nginx -> BFF on 127.0.0.1:3000.
#
# Three things here are load-bearing and none of them are obvious:
#
#   1. `proxy_protocol` on the listen directives is MANDATORY. The load
#      balancer is configured with proxyprotocol = true (see
#      infra/terraform/modules/compute), so every connection begins with a
#      PROXY header. Without this directive nginx reads that header as the
#      start of an HTTP request and every single connection fails with a
#      400 - which looks like an application bug, not a listener misconfig.
#
#   2. The Hetzner firewall's "Cloudflare ranges only" rule does NOT protect
#      this path. Load balancer traffic reaches the node on the private
#      interface, and Hetzner Cloud Firewalls filter the public interface only.
#      The allowlist check on $proxy_protocol_addr below is therefore the
#      enforcement point, not a duplicate of the firewall rule.
#
#   3. Authenticated Origin Pulls uses a CA shared by every Cloudflare
#      customer, so `ssl_verify_client on` alone proves only that the peer is
#      *someone's* Cloudflare. The subject check closes that gap.
# ---------------------------------------------------------------------------

upstream pullfm_bff {
    server 127.0.0.1:3000;
    keepalive 32;
}

# The load balancer is the only L3 peer, so its address is what nginx sees.
# realip rewrites $remote_addr to the address carried in the PROXY header,
# which is the Cloudflare edge node.
set_real_ip_from 10.20.1.0/24;
real_ip_header proxy_protocol;

# --- Port 80: redirect only ------------------------------------------------
server {
    listen 80 proxy_protocol default_server;
    listen [::]:80 proxy_protocol default_server;
    server_name _;

    # Kept on plain HTTP so the load balancer's health check cannot be broken
    # by a certificate problem: a cert failure should show as a TLS error, not
    # as every node being marked down.
    location = /healthz {
        access_log off;
        proxy_pass http://pullfm_bff;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Health check listener, no PROXY protocol ------------------------------
# The load balancer health check is a separate connection from the service
# traffic, and whether it carries a PROXY header is a vendor behaviour rather
# than something we configure. This listener exists so the health check works
# under either answer: point health_check_port at 8080 if it does not.
#
# Not publicly reachable: the origin firewall allows inbound 80 and 443 only.
server {
    listen 8080 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        proxy_pass http://pullfm_bff;
    }

    location / {
        return 404;
    }
}

# --- Port 443: the real origin ---------------------------------------------
server {
    # `http2 on;` is nginx >= 1.25 syntax and Ubuntu 24.04 ships 1.24, where it
    # is an unknown directive and nginx refuses to start. The listen-parameter
    # form works on both.
    listen 443 ssl http2 proxy_protocol default_server;
    listen [::]:443 ssl http2 proxy_protocol default_server;
    server_name api-staging.pull.fm app-staging.pull.fm;

    ssl_certificate     /etc/ssl/pullfm/origin.pem;
    ssl_certificate_key /etc/ssl/pullfm/origin.key;

    # Authenticated Origin Pulls. Cloudflare presents a client certificate
    # issued by this CA; anything that reaches port 443 without one is refused
    # during the handshake.
    ssl_client_certificate /etc/ssl/pullfm/origin-pull-ca.pem;
    ssl_verify_client on;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:pullfm:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # The origin certificate is issued by Cloudflare's private Origin CA, which
    # no public trust store contains and no public OCSP responder answers for.
    # Stapling would fail on every handshake and log an error per request.
    ssl_stapling off;

    server_tokens off;

    # $cloudflare_edge is defined in conf.d/cloudflare-allowlist.conf, which is
    # regenerated from Cloudflare's published ranges by pullfm-cf-ranges.timer.
    if ($cloudflare_edge = 0) {
        return 403;
    }

    # Shared-CA gap: every Cloudflare customer's origin-pull certificate
    # validates against the same CA, so the issuer proves the peer is
    # Cloudflare but not that it is fronting *our* zone. The subject is the
    # only distinguishing field available at this layer.
    if ($ssl_client_s_dn !~ "CN=origin-pull.cloudflare.net") {
        return 403;
    }

    client_max_body_size 256k;

    location / {
        proxy_pass http://pullfm_bff;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        # CF-Connecting-IP is trustworthy here precisely because the two checks
        # above already proved the peer is a Cloudflare edge node holding a
        # valid origin-pull certificate. Forwarding it as X-Forwarded-For is
        # what makes the BFF's per-IP rate limiting operate on the real client
        # rather than on a handful of edge addresses.
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
